name: World art integration PR checks

on:
  push:
    branches: [feat/world-art-integration]
  pull_request:
    branches:
      - design/impeccable-critique-optimize-extract
      - main

permissions:
  contents: read

concurrency:
  group: world-art-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, format, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Nonfunctional build-time fixture values only. No credentials or deploy.
      FIREBASE_API_KEY: ci-nonfunctional-key
      FIREBASE_AUTH_DOMAIN: ci.invalid
      FIREBASE_PROJECT_ID: hearth-ci
      FIREBASE_STORAGE_BUCKET: hearth-ci.invalid
      FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      FIREBASE_APP_ID: "1:1234567890:web:ci123"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - name: Install isolated Chromium verification environment
        run: |
          mkdir -p /tmp/hearth-playwright
          cd /tmp/hearth-playwright
          npm init -y
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture and assert 320/390/448px World UI
        env:
          PLAYWRIGHT_MODULE: /tmp/hearth-playwright/node_modules/playwright/index.mjs
        run: node scripts/captureWorldArt.mjs
      - name: Upload Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-art-browser-evidence
          path: world-art-browser-evidence/
          if-no-files-found: warn
