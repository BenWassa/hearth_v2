name: World art integration PR checks

on:
  push:
    branches: [feat/world-art-integration]
  pull_request:
    branches:
      - design/impeccable-critique-optimize-extract
      - main

permissions:
  contents: write

concurrency:
  group: world-art-validation
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, format, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Nonfunctional build-time fixture values only. No credentials or deploy.
      FIREBASE_API_KEY: ci-nonfunctional-key
      FIREBASE_AUTH_DOMAIN: ci.invalid
      FIREBASE_PROJECT_ID: hearth-ci
      FIREBASE_STORAGE_BUCKET: hearth-ci.invalid
      FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      FIREBASE_APP_ID: "1:1234567890:web:ci123"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format integration source (temporary)
        run: npx prettier --write src/components/cards/WorldCover.jsx src/components/cards/WorldHero.jsx src/config/collectionWorlds.js src/config/collectionWorlds.test.js src/index.css src/views/CollectionsBrowseView.jsx src/views/CollectionsBrowseView.test.jsx
      - name: Commit formatting to integration branch (temporary)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cards/WorldCover.jsx src/components/cards/WorldHero.jsx src/config/collectionWorlds.js src/config/collectionWorlds.test.js src/index.css src/views/CollectionsBrowseView.jsx src/views/CollectionsBrowseView.test.jsx
          if ! git diff --cached --quiet; then
            git commit -m "style(worlds): apply repository Prettier formatting"
            git push origin HEAD:feat/world-art-integration
          fi
      - run: npm run lint:ci
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - name: Install browser verification dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture and assert 320/390/448px World UI
        run: node scripts/captureWorldArt.mjs
      - name: Upload Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-art-browser-evidence
          path: world-art-browser-evidence/
          if-no-files-found: warn
